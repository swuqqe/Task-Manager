<!DOCTYPE html>
<html lang="uk">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager</title>

    <style>
      /* --- Дизайн та Змінні --- */
      :root {
        /* Світла тема */
        --bg-color: #f4f6f8;
        --surface: #ffffff;
        --surface-variant: #f0f4f8;
        --primary: #0b57d0;
        --primary-hover: #0842a0;
        --on-primary: #ffffff;
        --text-main: #1f1f1f;
        --text-muted: #5e5e5e;
        --border: #c7c7c7;
        --border-dashed: #a3a3a3;

        /* Тіні */
        --shadow-1: 0 1px 2px 0 rgba(0, 0, 0, 0.1), 0 1px 3px 1px rgba(0, 0, 0, 0.06);
        --shadow-2: 0 1px 2px 0 rgba(0, 0, 0, 0.1), 0 2px 6px 2px rgba(0, 0, 0, 0.06);
        --shadow-3: 0 4px 8px 3px rgba(0, 0, 0, 0.1), 0 1px 3px 0 rgba(0, 0, 0, 0.08);

        --radius-sm: 8px;
        --radius-md: 16px;
        --radius-lg: 24px;
        --transition: 0.3s cubic-bezier(0.2, 0, 0, 1);
      }

      html[data-theme="dark"] {
        --bg-color: #121212;
        --surface: #1e1e1e;
        --surface-variant: #2d2d2d;
        --primary: #a8c7fa;
        --primary-hover: #d3e3fd;
        --on-primary: #062e6f;
        --text-main: #e3e3e3;
        --text-muted: #c4c7c5;
        --border: #444746;
        --border-dashed: #5e5e5e;

        --shadow-1: 0 1px 2px 0 rgba(0, 0, 0, 0.3), 0 1px 3px 1px rgba(0, 0, 0, 0.15);
        --shadow-2: 0 1px 2px 0 rgba(0, 0, 0, 0.3), 0 2px 6px 2px rgba(0, 0, 0, 0.15);
        --shadow-3: 0 4px 8px 3px rgba(0, 0, 0, 0.4), 0 1px 3px 0 rgba(0, 0, 0, 0.2);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        transition: background-color 0.1s, color 0.1s;
        min-height: 100vh;
        overflow-x: hidden;
        display: flex;
        flex-direction: column;
      }

      /* --- View Transitions (Анімація зміни теми кругом) --- */
      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation: none;
        mix-blend-mode: normal;
      }

      ::view-transition-old(root) {
        z-index: 1;
      }

      ::view-transition-new(root) {
        z-index: 2;
      }

      /* --- Вітальне вікно --- */
      .welcome-screen {
        position: fixed;
        inset: 0;
        background-color: var(--surface);
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        text-align: center;
        transition: opacity 0.5s ease, transform 0.5s ease;
      }

      .welcome-screen.hidden {
        opacity: 0;
        pointer-events: none;
        transform: translateY(-20px) scale(0.98);
      }

      .welcome-icon {
        width: 80px;
        height: 80px;
        background: var(--primary);
        color: var(--on-primary);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        margin-bottom: 24px;
        box-shadow: var(--shadow-2);
        animation: bounceIn 0.8s cubic-bezier(0.2, 0, 0, 1);
      }

      .welcome-screen h1 {
        font-size: 2rem;
        margin-bottom: 12px;
        color: var(--text-main);
      }

      .welcome-screen p {
        font-size: 1.1rem;
        color: var(--text-muted);
        margin-bottom: 32px;
        max-width: 400px;
      }

      @keyframes bounceIn {
        0% {
          transform: scale(0.5);
          opacity: 0;
        }

        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      /* --- Header --- */
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 24px;
        background-color: var(--surface);
        box-shadow: var(--shadow-1);
        position: sticky;
        top: 0;
        z-index: 10;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-icon {
        width: 36px;
        height: 36px;
        background: var(--primary);
        color: var(--on-primary);
        border-radius: var(--radius-sm);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 18px;
      }

      .brand h1 {
        font-size: 1.25rem;
        font-weight: 600;
      }

      .icon-btn {
        background: transparent;
        border: none;
        color: var(--text-main);
        cursor: pointer;
        padding: 8px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background var(--transition);
      }

      .icon-btn:hover {
        background: var(--surface-variant);
      }

      .icon-btn:active {
        transform: scale(0.92);
      }

      /* --- Sidebar Drawer --- */
      .drawer-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        z-index: 100;
        opacity: 0;
        pointer-events: none;
        transition: opacity var(--transition);
      }

      .drawer-overlay.open {
        opacity: 1;
        pointer-events: auto;
      }

      .drawer {
        position: fixed;
        top: 0;
        right: -320px;
        width: 320px;
        max-width: 85vw;
        height: 100%;
        background: var(--surface);
        box-shadow: var(--shadow-3);
        z-index: 101;
        display: flex;
        flex-direction: column;
        transition: right var(--transition);
      }

      .drawer.open {
        right: 0;
      }

      .drawer-header {
        display: flex;
        align-items: center;
        padding: 16px 24px;
        border-bottom: 1px solid var(--border);
      }

      .drawer-header h2 {
        font-size: 1.2rem;
        font-weight: 600;
        flex: 1;
      }

      .drawer-content {
        padding: 16px;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 8px;
        overflow-y: auto;
      }

      .drawer-item {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 14px 16px;
        border-radius: var(--radius-md);
        background: transparent;
        border: none;
        color: var(--text-main);
        font-size: 1rem;
        font-weight: 500;
        cursor: pointer;
        text-align: left;
        transition: background var(--transition);
        text-decoration: none;
        width: 100%;
      }

      .drawer-item:hover {
        background: var(--surface-variant);
      }

      .drawer-divider {
        height: 1px;
        background: var(--border);
        margin: 8px 0;
      }

      /* Копірайт у меню */
      .drawer-footer {
        padding: 16px 24px;
        font-size: 0.8rem;
        color: var(--text-muted);
        border-top: 1px solid var(--border);
        text-align: center;
        background: var(--surface-variant);
      }

      /* --- Floating Action Button (FAB) --- */
      .fab {
        position: fixed;
        bottom: 32px;
        right: 32px;
        background-color: var(--primary);
        color: var(--on-primary);
        border: none;
        border-radius: 28px;
        box-shadow: var(--shadow-3);
        cursor: pointer;
        z-index: 90;
        display: flex;
        align-items: center;
        transition: background-color var(--transition), box-shadow var(--transition), transform var(--transition);
      }

      .fab-content {
        display: flex;
        align-items: center;
        height: 56px;
        padding: 0 14px;
      }

      .fab svg {
        width: 28px;
        height: 28px;
        flex-shrink: 0;
      }

      .fab-text {
        display: inline-block;
        max-width: 0;
        opacity: 0;
        overflow: hidden;
        white-space: nowrap;
        font-weight: 600;
        font-size: 1rem;
        margin-left: 0;
        transition: max-width 0.4s cubic-bezier(0.2, 0, 0, 1), margin-left 0.4s cubic-bezier(0.2, 0, 0, 1), opacity 0.3s ease;
      }

      .fab:hover {
        background-color: var(--primary-hover);
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        transform: translateY(-2px);
      }

      .fab:active {
        transform: scale(0.95);
      }

      .fab:hover .fab-text {
        max-width: 150px;
        opacity: 1;
        margin-left: 10px;
      }

      /* --- Kanban Board (Горизонтальна прокрутка) --- */
      .board {
        display: flex;
        gap: 24px;
        padding: 24px;
        align-items: start;
        flex: 1;
        overflow-x: auto;
        scrollbar-width: thin;
      }

      .column {
        background-color: var(--surface-variant);
        border: 2px dashed var(--border-dashed);
        border-radius: var(--radius-md);
        display: flex;
        flex-direction: column;
        min-width: 300px;
        width: 300px;
        flex-shrink: 0;
        max-height: calc(100vh - 120px);
        transition: background-color var(--transition), border-color var(--transition);
      }

      .column.drag-over {
        background-color: rgba(11, 87, 208, 0.05);
        border-color: var(--primary);
      }

      html[data-theme="dark"] .column.drag-over {
        background-color: rgba(168, 199, 250, 0.05);
      }

      .column-header {
        padding: 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .column-title {
        font-weight: 600;
        font-size: 1rem;
      }

      .task-count {
        background: var(--surface);
        color: var(--text-muted);
        font-size: 0.8rem;
        padding: 4px 10px;
        border-radius: 12px;
        font-weight: 600;
        box-shadow: var(--shadow-1);
      }

      .column-tasks {
        padding: 0 16px 16px 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        overflow-y: auto;
        min-height: 100px;
      }

      /* --- Task Card --- */
      .task-card {
        background: var(--surface);
        border-radius: var(--radius-sm);
        padding: 16px;
        box-shadow: var(--shadow-1);
        cursor: grab;
        transition: box-shadow var(--transition), transform 0.2s;
        display: flex;
        flex-direction: column;
        gap: 8px;
        border: 1px solid transparent;
      }

      .task-card:hover {
        box-shadow: var(--shadow-2);
        transform: translateY(-2px);
      }

      .task-card:active {
        cursor: grabbing;
        transform: scale(0.98);
      }

      .task-title {
        font-weight: 600;
        font-size: 1rem;
      }

      .task-desc {
        font-size: 0.85rem;
        color: var(--text-muted);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .task-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 8px;
        font-size: 0.8rem;
        color: var(--text-muted);
      }

      .badge {
        padding: 4px 8px;
        border-radius: 4px;
        font-weight: 600;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .badge-low {
        background: #e6f4ea;
        color: #137333;
      }

      .badge-medium {
        background: #fef7e0;
        color: #b06000;
      }

      .badge-high {
        background: #fce8e6;
        color: #c5221f;
      }

      html[data-theme="dark"] .badge-low {
        background: #0f5223;
        color: #81c995;
      }

      html[data-theme="dark"] .badge-medium {
        background: #684b00;
        color: #fde293;
      }

      html[data-theme="dark"] .badge-high {
        background: #691713;
        color: #f28b82;
      }

      /* --- Modals --- */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(2px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 200;
        opacity: 0;
        pointer-events: none;
        transition: opacity var(--transition);
      }

      .modal-overlay.open {
        opacity: 1;
        pointer-events: auto;
      }

      .modal {
        background: var(--surface);
        border-radius: var(--radius-lg);
        width: 100%;
        max-width: 450px;
        box-shadow: var(--shadow-3);
        transform: scale(0.9);
        transition: transform var(--transition);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        margin: 16px;
      }

      .modal-overlay.open .modal {
        transform: scale(1);
      }

      .modal-header {
        padding: 24px 24px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .modal-header h3 {
        font-size: 1.4rem;
        font-weight: 600;
      }

      .modal-body {
        padding: 0 24px 24px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        max-height: 65vh;
        overflow-y: auto;
      }

      /* Forms */
      .form-group {
        display: flex;
        flex-direction: column;
        position: relative;
      }

      .form-control {
        background: var(--surface-variant);
        border: none;
        border-bottom: 2px solid var(--border);
        border-radius: 4px 4px 0 0;
        padding: 20px 16px 8px;
        font-size: 1rem;
        color: var(--text-main);
        outline: none;
        transition: border-color var(--transition), background var(--transition);
      }

      .form-control:focus {
        border-bottom-color: var(--primary);
        background: var(--surface);
      }

      .form-group label {
        position: absolute;
        top: 16px;
        left: 16px;
        font-size: 1rem;
        color: var(--text-muted);
        pointer-events: none;
        transition: var(--transition);
      }

      .form-control:focus+label,
      .form-control:not(:placeholder-shown)+label {
        top: 4px;
        font-size: 0.75rem;
        color: var(--primary);
      }

      textarea.form-control {
        resize: none;
        min-height: 100px;
        padding-top: 24px;
      }

      select.form-control {
        padding: 14px 16px;
      }

      .select-label {
        font-size: 0.8rem;
        color: var(--text-muted);
        margin-bottom: 4px;
      }

      .modal-footer {
        padding: 16px 24px;
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        background: var(--surface-variant);
      }

      .btn {
        padding: 10px 24px;
        border-radius: 20px;
        font-weight: 600;
        font-size: 0.95rem;
        cursor: pointer;
        border: none;
        transition: all 0.2s;
      }

      .btn:active {
        transform: scale(0.95);
      }

      .btn-text {
        background: transparent;
        color: var(--primary);
      }

      .btn-text:hover {
        background: rgba(11, 87, 208, 0.08);
      }

      html[data-theme="dark"] .btn-text:hover {
        background: rgba(168, 199, 250, 0.08);
      }

      .btn-filled {
        background: var(--primary);
        color: var(--on-primary);
      }

      .btn-filled:hover {
        background: var(--primary-hover);
      }

      .btn-danger {
        color: #d93025;
        background: transparent;
      }

      .btn-danger:hover {
        background: rgba(217, 48, 37, 0.08);
      }

      html[data-theme="dark"] .btn-danger {
        color: #f28b82;
      }

      .lang-btn {
        background: var(--surface-variant);
        border: 1px solid var(--border);
        color: var(--text-main);
        padding: 12px;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 500;
        text-align: left;
        transition: all 0.2s;
      }

      .lang-btn:hover {
        background: rgba(11, 87, 208, 0.05);
        border-color: var(--primary);
      }
    </style>
  </head>

  <body>

    <!-- Вітальне вікно -->
    <div class="welcome-screen" id="welcome-screen">
      <div class="welcome-icon">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <h1 data-i18n="welcome_title">Вітаємо у Task Manager</h1>
      <p data-i18n="welcome_desc">Ваш мінімалістичний помічник для організації справ.</p>
      <button class="btn btn-filled" id="btn-continue"
        style="padding: 14px 32px; border-radius: 24px; font-size: 1.1rem;" data-i18n="btn_continue">
        Продовжити
      </button>
    </div>

    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="brand-icon">✓</div>
        <h1>Task Manager</h1>
      </div>
      <button class="icon-btn" id="open-menu-btn" title="Menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </header>

    <!-- Дошка (Kanban) -->
    <main class="board" id="board"></main>

    <!-- Плаваюча кнопка (FAB) -->
    <button class="fab" id="fab-new-task">
      <div class="fab-content">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span class="fab-text" data-i18n="new_task">Нова задача</span>
      </div>
    </button>

    <!-- Меню Drawer -->
    <div class="drawer-overlay" id="menu-overlay"></div>
    <aside class="drawer" id="menu-drawer">
      <div class="drawer-header">
        <h2 data-i18n="settings">Налаштування</h2>
        <button class="icon-btn" id="close-menu-btn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="drawer-content">
        <button class="drawer-item" id="btn-toggle-theme">
          <svg id="theme-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <span id="theme-text" data-i18n="theme_dark">Темна тема</span>
        </button>

        <button class="drawer-item" id="btn-open-lang">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          <span data-i18n="language">Мова</span>
        </button>

        <div class="drawer-divider"></div>

        <button class="drawer-item" id="btn-export">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span data-i18n="export">Зберегти у JSON</span>
        </button>
        <button class="drawer-item" id="btn-import">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          <span data-i18n="import">Завантажити з JSON</span>
        </button>

        <div class="drawer-divider"></div>

        <!-- Пункт Гіт хаб розробника -->
        <a href="https://github.com/swuqqe" target="_blank" class="drawer-item" id="btn-about">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path
              d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22">
            </path>
          </svg>
          <span data-i18n="about">Гіт хаб розробника</span>
        </a>
      </div>

      <!-- Копірайт у нижній частині меню -->
      <div class="drawer-footer">
        <span data-i18n="copyright">© 2026 Task Manager. Всі права захищені.</span>
      </div>
    </aside>

    <input type="file" id="import-file" accept=".json" style="display: none;">

    <!-- Модальні вікна -->
    <div class="modal-overlay" id="lang-modal">
      <div class="modal">
        <div class="modal-header">
          <h3 data-i18n="select_lang">Оберіть мову</h3>
        </div>
        <div class="modal-body" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
          <button class="btn lang-btn" data-lang="uk">🇺🇦 Українська</button>
          <button class="btn lang-btn" data-lang="en">🇬🇧 English</button>
          <button class="btn lang-btn" data-lang="ru">🇷🇺 Русский</button>
          <button class="btn lang-btn" data-lang="es">🇪🇸 Español</button>
          <button class="btn lang-btn" data-lang="de">🇩🇪 Deutsch</button>
          <button class="btn lang-btn" data-lang="fr">🇫🇷 Français</button>
        </div>
        <div class="modal-footer"><button class="btn btn-text close-modal" data-i18n="btn_cancel">Скасувати</button>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="task-modal">
      <div class="modal">
        <div class="modal-header">
          <h3 id="modal-title" data-i18n="create_task">Створити задачу</h3>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <input type="text" id="task-title" class="form-control" placeholder=" " required />
            <label for="task-title" data-i18n="task_title">Назва задачі *</label>
          </div>
          <div class="form-group">
            <input type="text" id="task-assignee" class="form-control" placeholder=" " />
            <label for="task-assignee" data-i18n="task_assignee">Виконавець</label>
          </div>
          <div class="form-group">
            <textarea id="task-desc" class="form-control" placeholder=" "></textarea>
            <label for="task-desc" data-i18n="task_desc">Додатковий опис</label>
          </div>
          <div style="display: flex; gap: 16px;">
            <div class="form-group" style="flex: 1;">
              <div class="select-label" data-i18n="status">Статус</div>
              <select id="task-status" class="form-control"></select>
            </div>
            <div class="form-group" style="flex: 1;">
              <div class="select-label" data-i18n="priority">Пріоритет</div>
              <select id="task-priority" class="form-control">
                <option value="low" data-i18n="priority_low">Низький</option>
                <option value="medium" data-i18n="priority_medium" selected>Середній</option>
                <option value="high" data-i18n="priority_high">Високий</option>
              </select>
            </div>
          </div>
        </div>
        <div class="modal-footer" style="justify-content: space-between;">
          <button class="btn btn-danger" id="btn-delete-task" style="display: none;"
            data-i18n="btn_delete">Видалити</button>
          <div style="display: flex; gap: 8px; margin-left: auto;">
            <button class="btn btn-text close-modal" data-i18n="btn_cancel">Скасувати</button>
            <button class="btn btn-filled" id="btn-save-task" data-i18n="btn_save">Зберегти</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      const TASK_STATUSES = [
        { id: 'todo' },
        { id: 'in_progress' },
        { id: 'in_review' },
        { id: 'done' },
        { id: 'released' }
      ];

      const dict = {
        uk: {
          welcome_title: "Вітаємо у Task Manager", welcome_desc: "Ваш помічник для організації справ.", btn_continue: "Продовжити",
          settings: "Налаштування", theme_dark: "Темна тема", theme_light: "Світла тема", export: "Зберегти у JSON", import: "Завантажити з JSON",
          language: "Мова", new_task: "Нова задача", copyright: "© 2026 Task Manager. Всі права захищені.",
          col_todo: "До виконання", col_in_progress: "В роботі", col_in_review: "На перевірці", col_done: "Виконано", col_released: "Випущено",
          create_task: "Створити задачу", edit_task: "Редагувати", task_title: "Назва задачі *", task_assignee: "Виконавець", task_desc: "Опис", status: "Статус",
          priority: "Пріоритет", priority_low: "Низький", priority_medium: "Середній", priority_high: "Високий", btn_delete: "Видалити",
          btn_cancel: "Скасувати", btn_save: "Зберегти", select_lang: "Оберіть мову", about: "Гіт хаб розробника", assignee_label: "Виконавець:"
        },
        en: {
          welcome_title: "Welcome to Task Manager", welcome_desc: "Your assistant for organizing tasks.", btn_continue: "Continue",
          settings: "Settings", theme_dark: "Dark Theme", theme_light: "Light Theme", export: "Export to JSON", import: "Import from JSON",
          language: "Language", new_task: "New Task", copyright: "© 2026 Task Manager. All rights reserved.",
          col_todo: "To Do", col_in_progress: "In Progress", col_in_review: "In Review", col_done: "Done", col_released: "Released",
          create_task: "Create Task", edit_task: "Edit Task", task_title: "Task Title *", task_assignee: "Assignee", task_desc: "Description", status: "Status",
          priority: "Priority", priority_low: "Low", priority_medium: "Medium", priority_high: "High", btn_delete: "Delete",
          btn_cancel: "Cancel", btn_save: "Save", select_lang: "Select Language", about: "Developer's GitHub", assignee_label: "Assignee:"
        },
        ru: {
          welcome_title: "Добро пожаловать", welcome_desc: "Ваш помощник для организации дел.", btn_continue: "Продолжить",
          settings: "Настройки", theme_dark: "Темная тема", theme_light: "Светлая тема", export: "Сохранить в JSON", import: "Загрузить из JSON",
          language: "Язык", new_task: "Новая задача", copyright: "© 2026 Task Manager. Все права защищены.",
          col_todo: "К выполнению", col_in_progress: "В работе", col_in_review: "На проверке", col_done: "Выполнено", col_released: "Выпущено",
          create_task: "Создать задачу", edit_task: "Редактировать", task_title: "Название *", task_assignee: "Исполнитель", task_desc: "Описание", status: "Статус",
          priority: "Приоритет", priority_low: "Низкий", priority_medium: "Средний", priority_high: "Высокий", btn_delete: "Удалить",
          btn_cancel: "Отмена", btn_save: "Сохранить", select_lang: "Выберите язык", about: "Гит хаб разработчика", assignee_label: "Исполнитель:"
        },
        es: {
          welcome_title: "Bienvenido", welcome_desc: "Tu asistente para organizar tareas.", btn_continue: "Continuar",
          settings: "Ajustes", theme_dark: "Tema oscuro", theme_light: "Tema claro", export: "Exportar JSON", import: "Importar JSON",
          language: "Idioma", new_task: "Nueva tarea", copyright: "© 2026 Task Manager. Todos los derechos reservados.",
          col_todo: "Por hacer", col_in_progress: "En curso", col_in_review: "En revisión", col_done: "Hecho", col_released: "Lanzado",
          create_task: "Crear tarea", edit_task: "Editar tarea", task_title: "Título *", task_assignee: "Asignado a", task_desc: "Descripción", status: "Estado",
          priority: "Prioridad", priority_low: "Baja", priority_medium: "Media", priority_high: "Alta", btn_delete: "Eliminar",
          btn_cancel: "Cancelar", btn_save: "Guardar", select_lang: "Seleccionar idioma", about: "GitHub del desarrollador", assignee_label: "Asignado:"
        },
        de: {
          welcome_title: "Willkommen", welcome_desc: "Ihr Assistent für Aufgaben.", btn_continue: "Weiter",
          settings: "Einstellungen", theme_dark: "Dunkles Design", theme_light: "Helles Design", export: "JSON Export", import: "JSON Import",
          language: "Sprache", new_task: "Neue Aufgabe", copyright: "© 2026 Task Manager. Alle Rechte vorbehalten.",
          col_todo: "Zu erledigen", col_in_progress: "In Bearbeitung", col_in_review: "In Prüfung", col_done: "Erledigt", col_released: "Veröffentlicht",
          create_task: "Aufgabe erstellen", edit_task: "Bearbeiten", task_title: "Titel *", task_assignee: "Zugewiesen", task_desc: "Beschreibung", status: "Status",
          priority: "Priorität", priority_low: "Niedrig", priority_medium: "Mittel", priority_high: "Hoch", btn_delete: "Löschen",
          btn_cancel: "Abbrechen", btn_save: "Speichern", select_lang: "Sprache wählen", about: "GitHub des Entwicklers", assignee_label: "Zugewiesen:"
        },
        fr: {
          welcome_title: "Bienvenue", welcome_desc: "Votre assistant pour les tâches.", btn_continue: "Continuer",
          settings: "Paramètres", theme_dark: "Thème sombre", theme_light: "Thème clair", export: "Exporter JSON", import: "Importer JSON",
          language: "Langue", new_task: "Nouvelle tâche", copyright: "© 2026 Task Manager. Tous droits réservés.",
          col_todo: "À faire", col_in_progress: "En cours", col_in_review: "En révision", col_done: "Terminé", col_released: "Publié",
          create_task: "Créer tâche", edit_task: "Modifier", task_title: "Titre *", task_assignee: "Assigné", task_desc: "Description", status: "Statut",
          priority: "Priorité", priority_low: "Basse", priority_medium: "Moyenne", priority_high: "Haute", btn_delete: "Supprimer",
          btn_cancel: "Annuler", btn_save: "Enregistrer", select_lang: "Choisir la langue", about: "GitHub du développeur", assignee_label: "Assigné :"
        }
      };

      let currentLang = localStorage.getItem('md_lang') || 'uk';
      let tasks = JSON.parse(localStorage.getItem('md_tasks')) || [];
      let isDarkTheme = localStorage.getItem('md_theme') === 'dark';
      let currentEditId = null;

      if (isDarkTheme) document.documentElement.setAttribute('data-theme', 'dark');
      if (!localStorage.getItem('md_visited')) {
        document.getElementById('welcome-screen').classList.remove('hidden');
      } else {
        document.getElementById('welcome-screen').classList.add('hidden');
      }

      function setLanguage(lang) {
        if (!dict[lang]) return;
        currentLang = lang;
        localStorage.setItem('md_lang', lang);

        document.querySelectorAll('[data-i18n]').forEach(el => {
          const key = el.getAttribute('data-i18n');
          if (dict[lang][key]) el.textContent = dict[lang][key];
        });

        updateThemeText();
        renderBoard();
        updateSelectOptions();
      }

      function updateSelectOptions() {
        const statusSelect = document.getElementById('task-status');
        statusSelect.innerHTML = TASK_STATUSES.map(s => `<option value="${s.id}">${dict[currentLang]['col_' + s.id]}</option>`).join('');
      }

      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          setLanguage(e.target.dataset.lang);
          document.getElementById('lang-modal').classList.remove('open');
        });
      });

      setLanguage(currentLang);

      document.getElementById('btn-continue').addEventListener('click', () => {
        document.getElementById('welcome-screen').classList.add('hidden');
        localStorage.setItem('md_visited', 'true');
      });

      function updateThemeText() {
        const text = dict[currentLang][isDarkTheme ? 'theme_light' : 'theme_dark'];
        document.getElementById('theme-text').textContent = text;
        const svg = isDarkTheme
          ? `<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>`
          : `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>`;
        document.getElementById('theme-icon').innerHTML = svg;
      }

      document.getElementById('btn-toggle-theme').addEventListener('click', (e) => {
        const x = e.clientX;
        const y = e.clientY;

        const toggleFunction = () => {
          isDarkTheme = !isDarkTheme;
          isDarkTheme ? document.documentElement.setAttribute('data-theme', 'dark') : document.documentElement.removeAttribute('data-theme');
          localStorage.setItem('md_theme', isDarkTheme ? 'dark' : 'light');
          updateThemeText();
        };

        if (!document.startViewTransition) {
          toggleFunction();
          return;
        }

        const transition = document.startViewTransition(toggleFunction);

        transition.ready.then(() => {
          const radius = Math.hypot(
            Math.max(x, window.innerWidth - x),
            Math.max(y, window.innerHeight - y)
          );

          const clipPath = [
            `circle(0px at ${x}px ${y}px)`,
            `circle(${radius}px at ${x}px ${y}px)`
          ];

          document.documentElement.animate(
            { clipPath: clipPath },
            {
              duration: 500,
              easing: 'ease-out',
              pseudoElement: '::view-transition-new(root)'
            }
          );
        });
      });

      const drawer = document.getElementById('menu-drawer');
      const drawerOverlay = document.getElementById('menu-overlay');
      document.getElementById('open-menu-btn').addEventListener('click', () => toggleDrawer(true));
      document.getElementById('close-menu-btn').addEventListener('click', () => toggleDrawer(false));
      drawerOverlay.addEventListener('click', () => toggleDrawer(false));

      function toggleDrawer(open) {
        drawer.classList.toggle('open', open);
        drawerOverlay.classList.toggle('open', open);
      }

      document.querySelectorAll('.close-modal').forEach(btn => {
        btn.addEventListener('click', () => btn.closest('.modal-overlay').classList.remove('open'));
      });

      function openModal(id) { document.getElementById(id).classList.add('open'); }

      document.getElementById('btn-open-lang').addEventListener('click', () => { toggleDrawer(false); openModal('lang-modal'); });

      document.getElementById('fab-new-task').addEventListener('click', () => {
        currentEditId = null;
        document.getElementById('task-title').value = '';
        document.getElementById('task-assignee').value = '';
        document.getElementById('task-desc').value = '';
        document.getElementById('task-status').value = 'todo';
        document.getElementById('task-priority').value = 'medium';
        document.getElementById('modal-title').textContent = dict[currentLang].create_task;
        document.getElementById('btn-delete-task').style.display = 'none';
        openModal('task-modal');
        setTimeout(() => document.getElementById('task-title').focus(), 100);
      });

      document.getElementById('btn-save-task').addEventListener('click', () => {
        const title = document.getElementById('task-title').value.trim();
        if (!title) return;
        const assignee = document.getElementById('task-assignee').value.trim();
        const desc = document.getElementById('task-desc').value.trim();
        const status = document.getElementById('task-status').value;
        const priority = document.getElementById('task-priority').value;

        if (currentEditId) {
          const task = tasks.find(t => t.id === currentEditId);
          if (task) { task.title = title; task.assignee = assignee; task.desc = desc; task.status = status; task.priority = priority; }
        } else {
          tasks.push({ id: Date.now().toString(), title, assignee, desc, status, priority });
        }

        saveAndRender();
        document.getElementById('task-modal').classList.remove('open');
      });

      document.getElementById('btn-delete-task').addEventListener('click', () => {
        if (currentEditId) { tasks = tasks.filter(t => t.id !== currentEditId); saveAndRender(); }
        document.getElementById('task-modal').classList.remove('open');
      });

      function renderBoard() {
        const board = document.getElementById('board');
        board.innerHTML = '';

        TASK_STATUSES.forEach(status => {
          const colTasks = tasks.filter(t => t.status === status.id);
          const colTitle = dict[currentLang]['col_' + status.id];

          const colDiv = document.createElement('div');
          colDiv.className = 'column';
          colDiv.dataset.status = status.id;

          colDiv.innerHTML = `
          <div class="column-header">
            <div class="column-title">${colTitle}</div>
            <div class="task-count">${colTasks.length}</div>
          </div>
          <div class="column-tasks"></div>
        `;

          const tasksContainer = colDiv.querySelector('.column-tasks');

          colDiv.addEventListener('dragover', e => { e.preventDefault(); colDiv.classList.add('drag-over'); });
          colDiv.addEventListener('dragleave', () => colDiv.classList.remove('drag-over'));
          colDiv.addEventListener('drop', e => {
            e.preventDefault();
            colDiv.classList.remove('drag-over');
            const id = e.dataTransfer.getData('text/plain');
            const task = tasks.find(t => t.id === id);
            if (task && task.status !== status.id) { task.status = status.id; saveAndRender(); }
          });

          colTasks.forEach(task => {
            const card = document.createElement('div');
            card.className = 'task-card';
            card.draggable = true;
            const priorityLabel = dict[currentLang]['priority_' + task.priority];
            const assigneeText = task.assignee ? `<span>👤 ${task.assignee}</span>` : '';

            card.innerHTML = `
            <div class="task-title">${task.title}</div>
            ${task.desc ? `<div class="task-desc">${task.desc}</div>` : ''}
            <div class="task-footer">
              ${assigneeText}
              <span class="badge badge-${task.priority}">${priorityLabel}</span>
            </div>
          `;

            card.addEventListener('dragstart', e => {
              e.dataTransfer.setData('text/plain', task.id);
              setTimeout(() => card.style.opacity = '0.4', 0);
            });
            card.addEventListener('dragend', () => card.style.opacity = '1');

            card.addEventListener('click', () => {
              currentEditId = task.id;
              document.getElementById('task-title').value = task.title;
              document.getElementById('task-assignee').value = task.assignee || '';
              document.getElementById('task-desc').value = task.desc;
              document.getElementById('task-status').value = task.status;
              document.getElementById('task-priority').value = task.priority;
              document.getElementById('modal-title').textContent = dict[currentLang].edit_task;
              document.getElementById('btn-delete-task').style.display = 'block';
              openModal('task-modal');
            });

            tasksContainer.appendChild(card);
          });
          board.appendChild(colDiv);
        });
      }

      function saveAndRender() { localStorage.setItem('md_tasks', JSON.stringify(tasks)); renderBoard(); }

      document.getElementById('btn-export').addEventListener('click', () => {
        const blob = new Blob([JSON.stringify(tasks, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = 'tasks.json'; a.click();
        toggleDrawer(false);
      });

      document.getElementById('btn-import').addEventListener('click', () => {
        document.getElementById('import-file').click();
        toggleDrawer(false);
      });

      document.getElementById('import-file').addEventListener('change', e => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = e => {
          try { tasks = JSON.parse(e.target.result); saveAndRender(); }
          catch (err) { alert('Помилка файлу / File error'); }
        };
        reader.readAsText(file);
      });
    </script>
  </body>

</html>
